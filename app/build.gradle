plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by CI from repository secrets).
// Without them the release build falls back to the debug key so local builds still install.
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.z1fire.forestwalk'
    compileSdk 34

    defaultConfig {
        applicationId 'com.z1fire.forestwalk'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystoreFile != null && file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig (keystoreFile != null ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
